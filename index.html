let current = "home";
function render(view){
  current = view;
  document.getElementById("app").innerHTML = navHTML() + (view==="home" ? homeHTML() : detailHTML(view));
  if(window.lucide) lucide.createIcons();
  setThemeIcon();
  revealInit();
}
function revealInit(){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els = document.querySelectorAll("[data-reveal]");
  if(reduce){ els.forEach(e=>e.classList.add("in")); return; }
  const io = new IntersectionObserver((ents)=>ents.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});
  els.forEach(e=>io.observe(e));
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
function navTo(id){ if(current!=="home"){ render("home"); setTimeout(()=>goTo(id),60);} else goTo(id); }
function goHome(){ render("home"); window.scrollTo({top:0,behavior:"smooth"}); }
function openProject(id){ const p=PROJECTS.find(x=>x.id===id); if(p){ render(p); window.scrollTo({top:0}); } }
function closeProject(){ render("home"); window.scrollTo({top:0}); }
function toggleTheme(){ const h=document.documentElement; h.dataset.theme = h.dataset.theme==="dark"?"light":"dark"; setThemeIcon(); }
function setThemeIcon(){ const b=document.getElementById("themeBtn"); if(b){ b.innerHTML = document.documentElement.dataset.theme==="dark"?ic('sun'):ic('moon'); if(window.lucide) lucide.createIcons(); } }
function sendMail(){
  const n=(document.getElementById("cf-name")||{}).value||"", e=(document.getElementById("cf-email")||{}).value||"", m=(document.getElementById("cf-msg")||{}).value||"";
  const subject=encodeURIComponent("Portfolio contact from "+(n||"someone"));
  const body=encodeURIComponent(m+"\n\n— "+n+" ("+e+")");
  window.location.href="mailto:"+PROFILE.email+"?subject="+subject+"&body="+body;
}
